<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TraceabilityRegistry — Esplora</title>
<link rel="icon" type="image/x-icon" href="./favicon.ico">
<link rel="stylesheet" href="./traceability-explorer-ui.css">
<script src="./traceability-decode.js"></script>
<script src="./traceability-explorer-ui.js"></script>
<style>
  :root { --powder-line: #e2e2e2; --ink-soft: #6b7280; --blueprint: #3454d1; }
  body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; background: #fafafa; }
  header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
  .header-left { display: flex; align-items: center; gap: 10px; }
  .site-logo { height: 72px; width: 72px; object-fit: contain; border-radius: 10px; flex-shrink: 0; }
  .site-banner { width: 100%; max-height: 100px; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 16px; }
  .lang-toggle { display: flex; gap: 4px; }
  .lang-btn { padding: 4px 10px; border: 1px solid #999; background: #fff; cursor: pointer; border-radius: 4px; font-size: 0.85rem; }
  .lang-btn.active { background: #222; color: #fff; }
  .lookup-form { display: flex; gap: 8px; margin-bottom: 20px; }
  .lookup-form input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
  .lookup-form button { padding: 8px 16px; background: #222; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  .muted { color: #777; font-size: 0.85rem; }
</style>
</head>
<body>

<img src="./banner._1800x1004.png" alt="" class="site-banner">

<header>
  <div class="header-left">
    <img src="./logo_700x700.png" alt="TraceabilityRegistry" class="site-logo">
    <h1 style="margin:0;">TraceabilityRegistry</h1>
  </div>
  <div class="lang-toggle">
    <button id="langItBtn" class="lang-btn active">IT</button>
    <button id="langEnBtn" class="lang-btn">EN</button>
  </div>
</header>

<div class="lookup-form" id="lookupForm">
  <input type="text" id="registryInput" placeholder="0x... (indirizzo del registry)">
  <button id="lookupBtn" data-i18n="lookup.button">Visualizza</button>
</div>

<div id="collectionHeader" class="te-collection-header"></div>
<div id="status" class="muted"></div>
<div id="filters" class="te-filters"></div>
<div id="grid" class="te-grid"></div>

<script>
const I18N = {
  it: {
    "lookup.button": "Visualizza", "lookup.placeholder": "0x... (indirizzo del registry)",
    "status.loading": "Caricamento...", "status.error": "Errore: {msg}",
    "status.empty": "Nessuna registrazione ancora per questo registry.",
    "status.noMatch": "Nessuna scheda corrisponde ai filtri selezionati.",
    "status.invalidRegistry": "Indirizzo non valido.",
    "filters.clear": "Cancella filtri",
    "filters.lotSearchPlaceholder": "Cerca per numero di lotto (qualunque ingrediente)...",
    "badge.lot": "Materia prima", "badge.batch": "Batch", "badge.invalidated": "Annullato",
    "card.usedLots": "Lotti utilizzati", "card.noImage": "Nessuna immagine",
    "card.invalidationReasonLabel": "Motivo:",
    "card.invalidateButton": "Annulla", "card.invalidating": "Annullamento in corso...",
    "card.invalidateReasonPrompt": "Motivo dell'annullamento:", "card.invalidateError": "Errore: {msg}",
  },
  en: {
    "lookup.button": "View", "lookup.placeholder": "0x... (registry address)",
    "status.loading": "Loading...", "status.error": "Error: {msg}",
    "status.empty": "No entries yet for this registry.",
    "status.noMatch": "No cards match the selected filters.",
    "status.invalidRegistry": "Invalid address.",
    "filters.clear": "Clear filters",
    "filters.lotSearchPlaceholder": "Search by lot number (any ingredient)...",
    "badge.lot": "Raw material", "badge.batch": "Batch", "badge.invalidated": "Invalidated",
    "card.usedLots": "Lots used", "card.noImage": "No image",
    "card.invalidationReasonLabel": "Reason:",
    "card.invalidateButton": "Invalidate", "card.invalidating": "Invalidating...",
    "card.invalidateReasonPrompt": "Reason for invalidation:", "card.invalidateError": "Error: {msg}",
  },
};

let currentLang = localStorage.getItem("traceabilityLang") || "it";

function t(key, params) {
  const dict = I18N[currentLang] || I18N.it;
  let str = dict[key] !== undefined ? dict[key] : (I18N.it[key] !== undefined ? I18N.it[key] : key);
  if (params) Object.keys(params).forEach((k) => { str = str.split("{" + k + "}").join(params[k]); });
  return str;
}

function applyLanguage() {
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.getElementById("registryInput").placeholder = t("lookup.placeholder");
  document.getElementById("langItBtn").classList.toggle("active", currentLang === "it");
  document.getElementById("langEnBtn").classList.toggle("active", currentLang === "en");
}
document.getElementById("langItBtn").addEventListener("click", () => { currentLang = "it"; localStorage.setItem("traceabilityLang", "it"); applyLanguage(); });
document.getElementById("langEnBtn").addEventListener("click", () => { currentLang = "en"; localStorage.setItem("traceabilityLang", "en"); applyLanguage(); });

const CONFIG = { BACKEND_BASE_URL: "https://traceability.chainintegrate.it" };

function isAddress(addr) {
  return /^0x[0-9a-fA-F]{40}$/.test(addr);
}

const gallery = TraceabilityExplorerUI.createGalleryInstance({
  headerEl: document.getElementById("collectionHeader"),
  statusEl: document.getElementById("status"),
  filtersEl: document.getElementById("filters"),
  gridEl: document.getElementById("grid"),
  t: t,
});

function loadRegistry(registryAddress) {
  if (!isAddress(registryAddress)) {
    document.getElementById("status").innerHTML = "<p class='te-err'>" + t("status.invalidRegistry") + "</p>";
    return;
  }
  gallery.load(CONFIG.BACKEND_BASE_URL, registryAddress);
}

document.getElementById("lookupBtn").addEventListener("click", () => {
  const addr = document.getElementById("registryInput").value.trim();
  const url = new URL(window.location.href);
  url.searchParams.set("registry", addr);
  window.history.replaceState({}, "", url);
  loadRegistry(addr);
});

// Se ?registry=0x... è già nell'URL, carica subito — utile per embed
// diretto via iframe su un sito esterno, senza compilare il form.
applyLanguage();
const initialRegistry = new URLSearchParams(window.location.search).get("registry") || "";
if (initialRegistry) {
  document.getElementById("registryInput").value = initialRegistry;
  document.getElementById("lookupForm").style.display = "none";
  loadRegistry(initialRegistry);
}
</script>

  <div id="footer-rights">© 2026 Chain Integrate — Tutti i diritti riservati.</div>

    <a href="https://www.linkedin.com/company/chainintegrate" target="_blank" rel="noopener" aria-label="ChainIntegrate su LinkedIn" style="color:var(--blueprint); display:inline-flex;">

    </a>
    <span>·</span>
    <a href="https://t.me/Simone_1977_2" target="_blank" rel="noopener" id="footer-telegram" style="color:var(--blueprint); text-decoration:none; font-weight:600;">Assistenza via Telegram</a>
  </div>
</footer>
</body>
</html>
