# Intestazioni di sicurezza per traceability.chainintegrate.it (audit §56).
# Da includere nel blocco `server { ... }` HTTPS, accanto all'include di
# shared-assets:
#     include /var/www/traceability-registry/nginx/security-headers.conf;
# poi `sudo nginx -t && sudo systemctl reload nginx`.
#
# Nota nginx: gli add_header del blocco server valgono per tutte le location
# che NON hanno add_header propri (qui: le pagine e /api/). La location
# /shared/ di shared-assets ha i suoi e non li eredita: va bene, sono file
# JavaScript/font, la CSP serve sulle pagine.

# --- Incorporamento in altri siti (clickjacking) --------------------------
# L'esploratore pubblico è pensato per stare in un <iframe> sui siti dei
# clienti: lì resta permesso. Pagine private, admin e guida: solo dal nostro
# dominio. Un add_header con valore vuoto non viene inviato.
set $tr_frame_ancestors "'self'";
set $tr_x_frame_options "SAMEORIGIN";
if ($uri = /explorer.html) {
    set $tr_frame_ancestors "*";
    set $tr_x_frame_options "";
}

add_header X-Frame-Options $tr_x_frame_options always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# --- Content-Security-Policy ------------------------------------------------
# - script-src: solo file dal nostro dominio (pagine, moduli, /shared/).
#   'unsafe-inline' serve finché le pagine hanno script e onclick nel codice
#   HTML; limita comunque molto: niente script da domini esterni.
# - connect-src: le pagine parlano solo col nostro backend, col nostro
#   gateway IPFS e, per il collegamento con UP Wallet, col relay di
#   WalletConnect (wss://relay.walletconnect.org/.com) e con l'RPC pubblico
#   di LUKSO mainnet (letture quando la UP è collegata con UP Wallet). È il
#   limite più utile contro un codice iniettato: non può spedire dati altrove.
#   https://api.universalprofile.cloud: gateway IPFS di LUKSO, solo per il
#   JSON dei profili (nome mostrato al posto dell'indirizzo), che il nostro
#   gateway non serve; il file si accetta solo se l'impronta coincide.
# - frame-src: solo l'iframe di WalletConnect Verify (verify.walletconnect.org/
#   .com), con cui UP Wallet controlla che la richiesta arrivi davvero dal
#   nostro dominio; senza, la verifica del dominio risulta UNKNOWN.
# - img-src: immagini nostre e dal gateway IPFS.
#
# ATTIVA (fase 2, dal 28/09/2026): la fase 1 in Report-Only, provata dal vivo
# con la UP collegata su pagine private, libreria, download ed esploratore,
# non ha segnalato nessuna violazione. Se una modifica futura alle pagine
# dovesse caricare risorse da un dominio nuovo, va aggiunto qui; per provare
# senza rischi si può tornare temporaneamente a
# "Content-Security-Policy-Report-Only" e guardare la console del browser.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ipfs.chainintegrate.it; connect-src 'self' https://ipfs.chainintegrate.it https://api.universalprofile.cloud https://rpc.mainnet.lukso.network wss://relay.walletconnect.org wss://relay.walletconnect.com https://verify.walletconnect.org https://verify.walletconnect.com; frame-src https://verify.walletconnect.org https://verify.walletconnect.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $tr_frame_ancestors" always;
