# Intestazioni di sicurezza per traceability.chainintegrate.it (audit §56).
# Da includere nel blocco `server { ... }` HTTPS, accanto all'include di
# shared-assets:
#     include /var/www/traceability-registry/nginx/security-headers.conf;
# poi `sudo nginx -t && sudo systemctl reload nginx`.
#
# Nota nginx: gli add_header del blocco server valgono per tutte le location
# che NON hanno add_header propri (qui: le pagine e /api/). La location
# /shared/ di shared-assets ha i suoi e non li eredita: va bene, sono file
# JavaScript/font, la CSP serve sulle pagine.

# --- Incorporamento in altri siti (clickjacking) --------------------------
# L'esploratore pubblico è pensato per stare in un <iframe> sui siti dei
# clienti: lì resta permesso. Pagine private, admin e guida: solo dal nostro
# dominio. Un add_header con valore vuoto non viene inviato.
set $tr_frame_ancestors "'self'";
set $tr_x_frame_options "SAMEORIGIN";
if ($uri = /explorer.html) {
    set $tr_frame_ancestors "*";
    set $tr_x_frame_options "";
}

add_header X-Frame-Options $tr_x_frame_options always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# --- Content-Security-Policy ------------------------------------------------
# - script-src: solo file dal nostro dominio (pagine, moduli, /shared/).
#   'unsafe-inline' serve finché le pagine hanno script e onclick nel codice
#   HTML; limita comunque molto: niente script da domini esterni.
# - connect-src: le pagine parlano solo col nostro backend e col nostro
#   gateway IPFS. È il limite più utile contro un codice iniettato: non può
#   spedire dati altrove.
# - img-src: immagini nostre e dal gateway IPFS.
#
# FASE 1 (questa): Report-Only = non blocca niente, segnala nella console del
# browser cosa bloccherebbe. Provare le pagine con la UP collegata; se la
# console non mostra "Content Security Policy" violata, passare alla FASE 2:
# sostituire "Content-Security-Policy-Report-Only" con "Content-Security-Policy".
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ipfs.chainintegrate.it; connect-src 'self' https://ipfs.chainintegrate.it; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $tr_frame_ancestors" always;
